<!doctype html>
<meta charset="utf-8">
<title>Lolosevka vs Iosevka</title>
<style>
	/* Lolosevka is loaded from the build output; hinted TTF first, unhinted as fallback.
	   Stock Iosevka must be installed system-wide. A missing font falls back to cursive so it's obvious. */
	@font-face { font-family: Lolo; font-weight: 400; font-style: normal;
		src: url(dist/Lolosevka/TTF/Lolosevka-Regular.ttf), url(dist/Lolosevka/TTF-Unhinted/Lolosevka-Regular.ttf); }
	@font-face { font-family: Lolo; font-weight: 700; font-style: normal;
		src: url(dist/Lolosevka/TTF/Lolosevka-Bold.ttf), url(dist/Lolosevka/TTF-Unhinted/Lolosevka-Bold.ttf); }
	@font-face { font-family: Lolo; font-weight: 400; font-style: italic;
		src: url(dist/Lolosevka/TTF/Lolosevka-Italic.ttf), url(dist/Lolosevka/TTF-Unhinted/Lolosevka-Italic.ttf); }
	@font-face { font-family: Lolo; font-weight: 700; font-style: italic;
		src: url(dist/Lolosevka/TTF/Lolosevka-BoldItalic.ttf), url(dist/Lolosevka/TTF-Unhinted/Lolosevka-BoldItalic.ttf); }

	body { margin: 0; padding: 16px; background: #1e1e1e; color: #ddd; font: 14px system-ui, sans-serif; }
	.bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
	textarea { width: 100%; height: 120px; box-sizing: border-box; background: #111; color: #ddd; font-family: monospace; }
	.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
	h2 { font-size: 13px; color: #888; margin: 8px 0; }
	h2 span { color: #e8a33d; }
	pre { margin: 0; padding: 12px; background: #111; white-space: pre-wrap; overflow-wrap: anywhere;
		font-size: var(--size); font-weight: var(--weight); font-style: var(--slope); }
	#stock { font-family: Iosevka, "Iosevka Nerd Font", cursive; }
	/* No faux bold/italic: unbuilt styles show the nearest real face instead. */
	#lolo { font-family: Lolo, cursive; font-synthesis: none; }
</style>

<div class="bar">
	<label>Size <input id="size" type="range" min="10" max="96" value="20"> <span id="sizeVal"></span>px</label>
	<label>Weight <select id="weight">
		<option value="100">Thin</option><option value="200">ExtraLight</option><option value="300">Light</option>
		<option value="400" selected>Regular</option><option value="500">Medium</option><option value="600">SemiBold</option>
		<option value="700">Bold</option><option value="800">ExtraBold</option><option value="900">Heavy</option>
	</select></label>
	<label>Slope <select id="slope">
		<option value="normal">Upright</option><option value="italic">Italic</option><option value="oblique">Oblique</option>
	</select></label>
</div>
<textarea id="text">The quick brown fox jumps over the lazy dog.
THE QUICK BROWN FOX JUMPS OVER THE LAZY DOG.
Ξεσκεπάζω την ψυχοφθόρα βδελυγμία.
ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ αβγδεζηθικλμνξοπρσςτυφχψω άέήίόύώ ϊϋΐΰ
0123456789 0O oO 1lI| rnm S5 B8 Z2 6b 9g
!"#$%&'()*+,-./:;<=>?@[\]^_`{|}~ -> => != == <= >= :: && || ++ --

#include <stdio.h>

/* Sum the even numbers below n. */
int sum_even(int n) {
    int total = 0;
    for (int i = 0; i < n; i++) {
        if (i % 2 == 0 && i != 0x1F) total += i;
    }
    return total;
}

int main(void) {
    printf("sum = %d\n", sum_even(100));
    return 0;
}</textarea>

<div class="cols">
	<div><h2>Iosevka (installed)</h2><pre id="stock"></pre></div>
	<div><h2>Lolosevka (dist/) <span id="missing"></span></h2><pre id="lolo"></pre></div>
</div>

<script>
	const $ = id => document.getElementById(id);
	const built = ["400 normal", "700 normal", "400 italic", "700 italic"]; // keep in sync with build-plans.toml
	const update = () => {
		$("stock").textContent = $("lolo").textContent = $("text").value;
		const s = document.body.style;
		s.setProperty("--size", $("size").value + "px");
		s.setProperty("--weight", $("weight").value);
		s.setProperty("--slope", $("slope").value);
		$("sizeVal").textContent = $("size").value;
		$("missing").textContent = built.includes(`${$("weight").value} ${$("slope").value}`)
			? "" : "(style not built, showing nearest)";
	};
	document.querySelectorAll("input, select, textarea").forEach(el => el.addEventListener("input", update));
	update();
</script>
